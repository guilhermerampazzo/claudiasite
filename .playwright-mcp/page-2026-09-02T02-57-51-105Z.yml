      - heading [level=2] [ref=e3558]:
        - text: Perguntas
        - emphasis [ref=e3559]: mais comuns
      - generic [ref=e3565]:
        - generic [ref=e3566]:
          - button "É normal aparecerem bolhas logo após a instalação?" [expanded] [ref=e3567] [cursor=pointer]: 
          - region "É normal aparecerem bolhas logo após a instalação?" [ref=e3569]: Sim. Pequenas bolhas são normais durante a secagem da cola e costumam desaparecer naturalmente entre 24 e 72 horas. Evite apertá-las ou tentar furá-las.
        - generic [ref=e3570]:
          - button "Vejo manchas ou acúmulo de cola. É normal?" [expanded] [ref=e3571] [cursor=pointer]: 
          - region "Vejo manchas ou acúmulo de cola. É normal?" [ref=e3573]: Sim. Durante a instalação pode haver pequenos resíduos de cola, que secam e desaparecem em poucos dias. Não tente remover com panos úmidos ou produtos químicos sem orientação.
        - generic [ref=e3574]:
          - button "Qual a diferença entre papel de parede e adesivo de parede?" [expanded] [ref=e3575] [cursor=pointer]: 
          - region "Qual a diferença entre papel de parede e adesivo de parede?" [ref=e3577]: Embora possam parecer semelhantes, são produtos bem diferentes. O papel de parede possui maior durabilidade, acabamento superior, melhor encaixe entre as emendas e aparência muito mais sofisticada. O adesivo de PVC tende a encolher, desbota com o tempo e tem vida útil inferior. Se o objetivo é um acabamento elegante e duradouro, o papel de parede é a melhor escolha.
        - generic [ref=e3578]:
          - button "Posso limpar o papel de parede?" [expanded] [ref=e3579] [cursor=pointer]: 
          - region "Posso limpar o papel de parede?" [ref=e3581]: Depende do modelo. A maioria dos papéis vinílicos pode ser limpa com pano levemente úmido e detergente neutro.
        - generic [ref=e3582]:
          - button "Papel de parede pode ser aplicado em banheiro?" [expanded] [ref=e3583] [cursor=pointer]: 
          - region "Papel de parede pode ser aplicado em banheiro?" [ref=e3585]: Sim, desde que seja na área seca, sem contato direto com água. Trabalhamos com papéis específicos que suportam melhor a umidade do ambiente.
        - generic [ref=e3586]:
          - button "Posso aplicar papel de parede sobre azulejo ou cerâmica?" [expanded] [ref=e3587] [cursor=pointer]: 
          - region "Posso aplicar papel de parede sobre azulejo ou cerâmica?" [ref=e3589]: Sim, é possível. Porém, antes da instalação é necessário emassar toda a superfície para eliminar as juntas dos azulejos e aplicar uma seladora, garantindo uma base lisa e adequada. A preparação da parede deve ser realizada previamente por um profissional de pintura, nossa equipe realiza apenas a instalação do papel sobre a superfície já preparada.
        - generic [ref=e3590]:
          - button "Preciso pintar a parede antes?" [expanded] [ref=e3591] [cursor=pointer]: 
          - region "Preciso pintar a parede antes?" [ref=e3593]: Nem sempre. É necessário apenas que a parede esteja lisa, seca, firme e sem infiltrações.
        - generic [ref=e3594]:
          - button "Pode aplicar sobre outro papel de parede?" [expanded] [ref=e3595] [cursor=pointer]: 
          - region "Pode aplicar sobre outro papel de parede?" [ref=e3597]: O recomendado é remover o papel antigo para garantir uma instalação perfeita.
        - generic [ref=e3598]:
          - button "Pode instalar na cozinha?" [expanded] [ref=e3599] [cursor=pointer]: 
          - region "Pode instalar na cozinha?" [ref=e3601]: Sim, desde que não fique atrás da pia, fogão ou locais com contato constante com gordura e água.
        - generic [ref=e3602]:
          - button "O papel estraga a parede?" [expanded] [ref=e3603] [cursor=pointer]: 
          - region "O papel estraga a parede?" [ref=e3605]: Não. Quando instalado corretamente sobre uma parede preparada, ele protege a superfície. A remoção depende do tipo de papel e da condição da parede.
        - generic [ref=e3606]:
          - button "Quanto tempo dura o papel de parede?" [expanded] [ref=e3607] [cursor=pointer]: 
          - region "Quanto tempo dura o papel de parede?" [ref=e3609]: Com instalação profissional e os cuidados corretos, é comum que dure entre 10 e 15 anos, podendo durar ainda mais em ambientes bem conservados.
        - generic [ref=e3610]:
          - button "Em quanto tempo a instalação fica pronta?" [expanded] [ref=e3611] [cursor=pointer]: 
          - region "Em quanto tempo a instalação fica pronta?" [ref=e3613]: Na maioria dos ambientes residenciais, a instalação é concluída em apenas um dia.
        - generic [ref=e3614]:
          - button "Qual a diferença entre papel vinílico e Non Woven (TNT)?" [expanded] [ref=e3615] [cursor=pointer]: 
          - region "Qual a diferença entre papel vinílico e Non Woven (TNT)?" [ref=e3617]: O papel vinílico recebe uma camada de PVC na superfície, é resistente à limpeza e ao desgaste do dia a dia, com excelente durabilidade. O Non Woven (TNT Premium) é produzido com fibras têxteis de alta qualidade, considerado linha premium pelos principais fabricantes europeus. É mais respirável, tem maior estabilidade dimensional, evita bolhas por umidade residual e tem fácil remoção na hora da troca. Nossa equipe ajuda você a escolher o mais indicado para cada ambiente.
        - generic [ref=e3618]:
          - button "Vocês têm papéis importados à pronta entrega?" [expanded] [ref=e3619] [cursor=pointer]: 
          - region "Vocês têm papéis importados à pronta entrega?" [ref=e3621]: Sim. Mantemos estoque de diversos modelos importados para agilizar a entrega. Também trabalhamos com catálogos exclusivos e lançamentos de grandes fabricantes internacionais.
        - generic [ref=e3622]:
          - button "Papel de parede com relevo acumula poeira?" [expanded] [ref=e3623] [cursor=pointer]: 
          - region "Papel de parede com relevo acumula poeira?" [ref=e3625]: Não de forma significativa. A poeira é semelhante à de uma parede pintada e pode ser removida com espanador, pano seco ou aspirador com bocal de escova. A textura não exige manutenção especial.
        - generic [ref=e3626]:
          - button "Se eu enjoar, é fácil trocar?" [expanded] [ref=e3627] [cursor=pointer]: 
          - region "Se eu enjoar, é fácil trocar?" [ref=e3629]: Sim. O papel pode ser removido e substituído quando quiser renovar o ambiente. Nos papéis Non Woven, a remoção é bastante simples quando a parede foi preparada corretamente.
        - generic [ref=e3630]:
          - button "A instalação tem cheiro?" [expanded] [ref=e3631] [cursor=pointer]: 
          - region "A instalação tem cheiro?" [ref=e3633]: Não. Utilizamos cola à base de água, própria para instalação de papéis de parede.
        - generic [ref=e3634]:
          - button "Vale mais a pena pintar ou colocar papel de parede?" [expanded] [ref=e3635] [cursor=pointer]: 
          - region "Vale mais a pena pintar ou colocar papel de parede?" [ref=e3637]: Quando pensamos em custo-benefício a longo prazo, o papel de parede costuma ser a melhor escolha. Enquanto a pintura precisa de retoques a cada poucos anos, um papel de qualidade dura entre 10 e 15 anos mantendo beleza e acabamento. Além disso, agrega textura, estampas exclusivas e sofisticação, transformando o ambiente com rapidez e pouca sujeira.
        - generic [ref=e3638]:
          - button "Posso instalar atrás da cabeceira da cama?" [expanded] [ref=e3639] [cursor=pointer]: 
          - region "Posso instalar atrás da cabeceira da cama?" [ref=e3641]: Sim. Essa é uma das aplicações mais procuradas e cria um grande impacto visual sem necessidade de reformas.
        - generic [ref=e3642]:
          - button "Papel de parede pode mofar?" [expanded] [ref=e3643] [cursor=pointer]: 
          - region "Papel de parede pode mofar?" [ref=e3645]: O papel de parede não é a causa do mofo. Se houver infiltração ou umidade na parede, o problema precisa ser resolvido antes da instalação... caso contrário, qualquer revestimento pode ser comprometido.
