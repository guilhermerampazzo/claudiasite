      - generic [ref=f5e3039]:
        - generic [ref=f5e3040]:
          - button "É normal aparecerem bolhas logo após a instalação?" [expanded] [ref=f5e3041] [cursor=pointer]:
            - generic [aria-hidden] [ref=f5e3042]: 
          - region "É normal aparecerem bolhas logo após a instalação?" [ref=f5e3044]: Sim. Pequenas bolhas são normais durante a secagem da cola e costumam desaparecer naturalmente entre 24 e 72 horas. Evite apertá-las ou tentar furá-las.
        - generic [ref=f5e3045]:
          - button "Vejo manchas ou acúmulo de cola. É normal?" [expanded] [ref=f5e3046] [cursor=pointer]:
            - generic [aria-hidden] [ref=f5e3047]: 
          - region "Vejo manchas ou acúmulo de cola. É normal?" [ref=f5e3049]: Sim. Durante a instalação pode haver pequenos resíduos de cola, que secam e desaparecem em poucos dias. Não tente remover com panos úmidos ou produtos químicos sem orientação.
        - generic [ref=f5e3050]:
          - button "Qual a diferença entre papel de parede e adesivo de parede?" [expanded] [ref=f5e3051] [cursor=pointer]:
            - generic [aria-hidden] [ref=f5e3052]: 
          - region "Qual a diferença entre papel de parede e adesivo de parede?" [ref=f5e3054]: Embora possam parecer semelhantes, são produtos bem diferentes. O papel de parede possui maior durabilidade, acabamento superior, melhor encaixe entre as emendas e aparência muito mais sofisticada. O adesivo de PVC tende a encolher, desbota com o tempo e tem vida útil inferior. Se o objetivo é um acabamento elegante e duradouro, o papel de parede é a melhor escolha.
        - generic [ref=f5e3055]:
          - button "Posso limpar o papel de parede?" [expanded] [ref=f5e3056] [cursor=pointer]:
            - generic [aria-hidden] [ref=f5e3057]: 
          - region "Posso limpar o papel de parede?" [ref=f5e3059]: Depende do modelo. A maioria dos papéis vinílicos pode ser limpa com pano levemente úmido e detergente neutro.
        - generic [ref=f5e3060]:
          - button "Papel de parede pode ser aplicado em banheiro?" [expanded] [ref=f5e3061] [cursor=pointer]:
            - generic [aria-hidden] [ref=f5e3062]: 
          - region "Papel de parede pode ser aplicado em banheiro?" [ref=f5e3064]: Sim, desde que seja na área seca, sem contato direto com água. Trabalhamos com papéis específicos que suportam melhor a umidade do ambiente.
        - generic [ref=f5e3065]:
          - button "Posso aplicar papel de parede sobre azulejo ou cerâmica?" [expanded] [ref=f5e3066] [cursor=pointer]:
            - generic [aria-hidden] [ref=f5e3067]: 
          - region "Posso aplicar papel de parede sobre azulejo ou cerâmica?" [ref=f5e3069]: Sim, é possível. Porém, antes da instalação é necessário emassar toda a superfície para eliminar as juntas dos azulejos e aplicar uma seladora, garantindo uma base lisa e adequada. A preparação da parede deve ser realizada previamente por um profissional de pintura, nossa equipe realiza apenas a instalação do papel sobre a superfície já preparada.
        - generic [ref=f5e3070]:
          - button "Preciso pintar a parede antes?" [expanded] [ref=f5e3071] [cursor=pointer]:
            - generic [aria-hidden] [ref=f5e3072]: 
          - region "Preciso pintar a parede antes?" [ref=f5e3074]: Nem sempre. É necessário apenas que a parede esteja lisa, seca, firme e sem infiltrações.
        - generic [ref=f5e3075]:
          - button "Pode aplicar sobre outro papel de parede?" [expanded] [ref=f5e3076] [cursor=pointer]:
            - generic [aria-hidden] [ref=f5e3077]: 
          - region "Pode aplicar sobre outro papel de parede?" [ref=f5e3079]: O recomendado é remover o papel antigo para garantir uma instalação perfeita.
        - generic [ref=f5e3080]:
          - button "Pode instalar na cozinha?" [expanded] [ref=f5e3081] [cursor=pointer]:
            - generic [aria-hidden] [ref=f5e3082]: 
          - region "Pode instalar na cozinha?" [ref=f5e3084]: Sim, desde que não fique atrás da pia, fogão ou locais com contato constante com gordura e água.
        - generic [ref=f5e3085]:
          - button "O papel estraga a parede?" [expanded] [ref=f5e3086] [cursor=pointer]:
            - generic [aria-hidden] [ref=f5e3087]: 
          - region "O papel estraga a parede?" [ref=f5e3089]: Não. Quando instalado corretamente sobre uma parede preparada, ele protege a superfície. A remoção depende do tipo de papel e da condição da parede.
        - generic [ref=f5e3090]:
          - button "Quanto tempo dura o papel de parede?" [expanded] [ref=f5e3091] [cursor=pointer]:
            - generic [aria-hidden] [ref=f5e3092]: 
          - region "Quanto tempo dura o papel de parede?" [ref=f5e3094]: Com instalação profissional e os cuidados corretos, é comum que dure entre 10 e 15 anos, podendo durar ainda mais em ambientes bem conservados.
        - generic [ref=f5e3095]:
          - button "Em quanto tempo a instalação fica pronta?" [expanded] [ref=f5e3096] [cursor=pointer]:
            - generic [aria-hidden] [ref=f5e3097]: 
          - region "Em quanto tempo a instalação fica pronta?" [ref=f5e3099]: Na maioria dos ambientes residenciais, a instalação é concluída em apenas um dia.
        - generic [ref=f5e3100]:
          - button "Qual a diferença entre papel vinílico e Non Woven (TNT)?" [expanded] [ref=f5e3101] [cursor=pointer]:
            - generic [aria-hidden] [ref=f5e3102]: 
          - region "Qual a diferença entre papel vinílico e Non Woven (TNT)?" [ref=f5e3104]: O papel vinílico recebe uma camada de PVC na superfície, é resistente à limpeza e ao desgaste do dia a dia, com excelente durabilidade. O Non Woven (TNT Premium) é produzido com fibras têxteis de alta qualidade, considerado linha premium pelos principais fabricantes europeus. É mais respirável, tem maior estabilidade dimensional, evita bolhas por umidade residual e tem fácil remoção na hora da troca. Nossa equipe ajuda você a escolher o mais indicado para cada ambiente.
        - generic [ref=f5e3105]:
          - button "Vocês têm papéis importados à pronta entrega?" [expanded] [ref=f5e3106] [cursor=pointer]:
            - generic [aria-hidden] [ref=f5e3107]: 
          - region "Vocês têm papéis importados à pronta entrega?" [ref=f5e3109]: Sim. Mantemos estoque de diversos modelos importados para agilizar a entrega. Também trabalhamos com catálogos exclusivos e lançamentos de grandes fabricantes internacionais.
        - generic [ref=f5e3110]:
          - button "Papel de parede com relevo acumula poeira?" [expanded] [ref=f5e3111] [cursor=pointer]:
            - generic [aria-hidden] [ref=f5e3112]: 
          - region "Papel de parede com relevo acumula poeira?" [ref=f5e3114]: Não de forma significativa. A poeira é semelhante à de uma parede pintada e pode ser removida com espanador, pano seco ou aspirador com bocal de escova. A textura não exige manutenção especial.
        - generic [ref=f5e3115]:
          - button "Se eu enjoar, é fácil trocar?" [expanded] [ref=f5e3116] [cursor=pointer]:
            - generic [aria-hidden] [ref=f5e3117]: 
          - region "Se eu enjoar, é fácil trocar?" [ref=f5e3119]: Sim. O papel pode ser removido e substituído quando quiser renovar o ambiente. Nos papéis Non Woven, a remoção é bastante simples quando a parede foi preparada corretamente.
        - generic [ref=f5e3120]:
          - button "A instalação tem cheiro?" [expanded] [ref=f5e3121] [cursor=pointer]:
            - generic [aria-hidden] [ref=f5e3122]: 
          - region "A instalação tem cheiro?" [ref=f5e3124]: Não. Utilizamos cola à base de água, própria para instalação de papéis de parede.
        - generic [ref=f5e3125]:
          - button "Vale mais a pena pintar ou colocar papel de parede?" [expanded] [ref=f5e3126] [cursor=pointer]:
            - generic [aria-hidden] [ref=f5e3127]: 
          - region "Vale mais a pena pintar ou colocar papel de parede?" [ref=f5e3129]: Quando pensamos em custo-benefício a longo prazo, o papel de parede costuma ser a melhor escolha. Enquanto a pintura precisa de retoques a cada poucos anos, um papel de qualidade dura entre 10 e 15 anos mantendo beleza e acabamento. Além disso, agrega textura, estampas exclusivas e sofisticação, transformando o ambiente com rapidez e pouca sujeira.
        - generic [ref=f5e3130]:
          - button "Posso instalar atrás da cabeceira da cama?" [expanded] [ref=f5e3131] [cursor=pointer]:
            - generic [aria-hidden] [ref=f5e3132]: 
          - region "Posso instalar atrás da cabeceira da cama?" [ref=f5e3134]: Sim. Essa é uma das aplicações mais procuradas e cria um grande impacto visual sem necessidade de reformas.
        - generic [ref=f5e3135]:
          - button "Papel de parede pode mofar?" [expanded] [ref=f5e3136] [cursor=pointer]:
            - generic [aria-hidden] [ref=f5e3137]: 
          - region "Papel de parede pode mofar?" [ref=f5e3139]: O papel de parede não é a causa do mofo. Se houver infiltração ou umidade na parede, o problema precisa ser resolvido antes da instalação... caso contrário, qualquer revestimento pode ser comprometido.
