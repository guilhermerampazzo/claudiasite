    - generic [ref=f2e3004]:
      - generic [ref=f2e3005]: Dúvidas frequentes
      - heading [level=2] [ref=f2e3012]:
        - text: Perguntas
        - emphasis [ref=f2e3013]: mais comuns
      - generic [ref=f2e3019]:
        - generic [ref=f2e3020]:
          - button "É normal aparecerem bolhas logo após a instalação?" [expanded] [ref=f2e3021] [cursor=pointer]:
            - generic [aria-hidden] [ref=f2e3022]: 
          - region "É normal aparecerem bolhas logo após a instalação?" [ref=f2e3024]: Sim. Pequenas bolhas são normais durante a secagem da cola e costumam desaparecer naturalmente entre 24 e 72 horas. Evite apertá-las ou tentar furá-las.
        - generic [ref=f2e3025]:
          - button "Vejo manchas ou acúmulo de cola. É normal?" [expanded] [ref=f2e3026] [cursor=pointer]:
            - generic [aria-hidden] [ref=f2e3027]: 
          - region "Vejo manchas ou acúmulo de cola. É normal?" [ref=f2e3029]: Sim. Durante a instalação pode haver pequenos resíduos de cola, que secam e desaparecem em poucos dias. Não tente remover com panos úmidos ou produtos químicos sem orientação.
        - generic [ref=f2e3030]:
          - button "Qual a diferença entre papel de parede e adesivo de parede?" [expanded] [ref=f2e3031] [cursor=pointer]:
            - generic [aria-hidden] [ref=f2e3032]: 
          - region "Qual a diferença entre papel de parede e adesivo de parede?" [ref=f2e3034]: Embora possam parecer semelhantes, são produtos bem diferentes. O papel de parede possui maior durabilidade, acabamento superior, melhor encaixe entre as emendas e aparência muito mais sofisticada. O adesivo de PVC tende a encolher, desbota com o tempo e tem vida útil inferior. Se o objetivo é um acabamento elegante e duradouro, o papel de parede é a melhor escolha.
        - generic [ref=f2e3035]:
          - button "Posso limpar o papel de parede?" [expanded] [ref=f2e3036] [cursor=pointer]:
            - generic [aria-hidden] [ref=f2e3037]: 
          - region "Posso limpar o papel de parede?" [ref=f2e3039]: Depende do modelo. A maioria dos papéis vinílicos pode ser limpa com pano levemente úmido e detergente neutro.
        - generic [ref=f2e3040]:
          - button "Papel de parede pode ser aplicado em banheiro?" [expanded] [ref=f2e3041] [cursor=pointer]:
            - generic [aria-hidden] [ref=f2e3042]: 
          - region "Papel de parede pode ser aplicado em banheiro?" [ref=f2e3044]: Sim, desde que seja na área seca, sem contato direto com água. Trabalhamos com papéis específicos que suportam melhor a umidade do ambiente.
        - generic [ref=f2e3045]:
          - button "Posso aplicar papel de parede sobre azulejo ou cerâmica?" [expanded] [ref=f2e3046] [cursor=pointer]:
            - generic [aria-hidden] [ref=f2e3047]: 
          - region "Posso aplicar papel de parede sobre azulejo ou cerâmica?" [ref=f2e3049]: Sim, é possível. Porém, antes da instalação é necessário emassar toda a superfície para eliminar as juntas dos azulejos e aplicar uma seladora, garantindo uma base lisa e adequada. A preparação da parede deve ser realizada previamente por um profissional de pintura, nossa equipe realiza apenas a instalação do papel sobre a superfície já preparada.
        - generic [ref=f2e3050]:
          - button "Preciso pintar a parede antes?" [expanded] [ref=f2e3051] [cursor=pointer]:
            - generic [aria-hidden] [ref=f2e3052]: 
          - region "Preciso pintar a parede antes?" [ref=f2e3054]: Nem sempre. É necessário apenas que a parede esteja lisa, seca, firme e sem infiltrações.
        - generic [ref=f2e3055]:
          - button "Pode aplicar sobre outro papel de parede?" [expanded] [ref=f2e3056] [cursor=pointer]:
            - generic [aria-hidden] [ref=f2e3057]: 
          - region "Pode aplicar sobre outro papel de parede?" [ref=f2e3059]: O recomendado é remover o papel antigo para garantir uma instalação perfeita.
        - generic [ref=f2e3060]:
          - button "Pode instalar na cozinha?" [expanded] [ref=f2e3061] [cursor=pointer]:
            - generic [aria-hidden] [ref=f2e3062]: 
          - region "Pode instalar na cozinha?" [ref=f2e3064]: Sim, desde que não fique atrás da pia, fogão ou locais com contato constante com gordura e água.
        - generic [ref=f2e3065]:
          - button "O papel estraga a parede?" [expanded] [ref=f2e3066] [cursor=pointer]:
            - generic [aria-hidden] [ref=f2e3067]: 
          - region "O papel estraga a parede?" [ref=f2e3069]: Não. Quando instalado corretamente sobre uma parede preparada, ele protege a superfície. A remoção depende do tipo de papel e da condição da parede.
        - generic [ref=f2e3070]:
          - button "Quanto tempo dura o papel de parede?" [expanded] [ref=f2e3071] [cursor=pointer]:
            - generic [aria-hidden] [ref=f2e3072]: 
          - region "Quanto tempo dura o papel de parede?" [ref=f2e3074]: Com instalação profissional e os cuidados corretos, é comum que dure entre 10 e 15 anos, podendo durar ainda mais em ambientes bem conservados.
        - generic [ref=f2e3075]:
          - button "Em quanto tempo a instalação fica pronta?" [expanded] [ref=f2e3076] [cursor=pointer]:
            - generic [aria-hidden] [ref=f2e3077]: 
          - region "Em quanto tempo a instalação fica pronta?" [ref=f2e3079]: Na maioria dos ambientes residenciais, a instalação é concluída em apenas um dia.
        - generic [ref=f2e3080]:
          - button "Qual a diferença entre papel vinílico e Non Woven (TNT)?" [expanded] [ref=f2e3081] [cursor=pointer]:
            - generic [aria-hidden] [ref=f2e3082]: 
          - region "Qual a diferença entre papel vinílico e Non Woven (TNT)?" [ref=f2e3084]: O papel vinílico recebe uma camada de PVC na superfície, é resistente à limpeza e ao desgaste do dia a dia, com excelente durabilidade. O Non Woven (TNT Premium) é produzido com fibras têxteis de alta qualidade, considerado linha premium pelos principais fabricantes europeus. É mais respirável, tem maior estabilidade dimensional, evita bolhas por umidade residual e tem fácil remoção na hora da troca. Nossa equipe ajuda você a escolher o mais indicado para cada ambiente.
        - generic [ref=f2e3085]:
          - button "Vocês têm papéis importados à pronta entrega?" [expanded] [ref=f2e3086] [cursor=pointer]:
            - generic [aria-hidden] [ref=f2e3087]: 
          - region "Vocês têm papéis importados à pronta entrega?" [ref=f2e3089]: Sim. Mantemos estoque de diversos modelos importados para agilizar a entrega. Também trabalhamos com catálogos exclusivos e lançamentos de grandes fabricantes internacionais.
        - generic [ref=f2e3090]:
          - button "Papel de parede com relevo acumula poeira?" [expanded] [ref=f2e3091] [cursor=pointer]:
            - generic [aria-hidden] [ref=f2e3092]: 
          - region "Papel de parede com relevo acumula poeira?" [ref=f2e3094]: Não de forma significativa. A poeira é semelhante à de uma parede pintada e pode ser removida com espanador, pano seco ou aspirador com bocal de escova. A textura não exige manutenção especial.
        - generic [ref=f2e3095]:
          - button "Se eu enjoar, é fácil trocar?" [expanded] [ref=f2e3096] [cursor=pointer]:
            - generic [aria-hidden] [ref=f2e3097]: 
          - region "Se eu enjoar, é fácil trocar?" [ref=f2e3099]: Sim. O papel pode ser removido e substituído quando quiser renovar o ambiente. Nos papéis Non Woven, a remoção é bastante simples quando a parede foi preparada corretamente.
        - generic [ref=f2e3100]:
          - button "A instalação tem cheiro?" [expanded] [ref=f2e3101] [cursor=pointer]:
            - generic [aria-hidden] [ref=f2e3102]: 
          - region "A instalação tem cheiro?" [ref=f2e3104]: Não. Utilizamos cola à base de água, própria para instalação de papéis de parede.
        - generic [ref=f2e3105]:
          - button "Vale mais a pena pintar ou colocar papel de parede?" [expanded] [ref=f2e3106] [cursor=pointer]:
            - generic [aria-hidden] [ref=f2e3107]: 
          - region "Vale mais a pena pintar ou colocar papel de parede?" [ref=f2e3109]: Quando pensamos em custo-benefício a longo prazo, o papel de parede costuma ser a melhor escolha. Enquanto a pintura precisa de retoques a cada poucos anos, um papel de qualidade dura entre 10 e 15 anos mantendo beleza e acabamento. Além disso, agrega textura, estampas exclusivas e sofisticação, transformando o ambiente com rapidez e pouca sujeira.
        - generic [ref=f2e3110]:
          - button "Posso instalar atrás da cabeceira da cama?" [expanded] [ref=f2e3111] [cursor=pointer]:
            - generic [aria-hidden] [ref=f2e3112]: 
          - region "Posso instalar atrás da cabeceira da cama?" [ref=f2e3114]: Sim. Essa é uma das aplicações mais procuradas e cria um grande impacto visual sem necessidade de reformas.
        - generic [ref=f2e3115]:
          - button "Papel de parede pode mofar?" [expanded] [ref=f2e3116] [cursor=pointer]:
            - generic [aria-hidden] [ref=f2e3117]: 
          - region "Papel de parede pode mofar?" [ref=f2e3119]: O papel de parede não é a causa do mofo. Se houver infiltração ou umidade na parede, o problema precisa ser resolvido antes da instalação... caso contrário, qualquer revestimento pode ser comprometido.
