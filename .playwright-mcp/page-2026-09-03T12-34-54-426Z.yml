      - generic [ref=e2998]: Dúvidas frequentes
      - heading [level=2] [ref=e3005]:
        - text: Perguntas
        - emphasis [ref=e3006]: mais comuns
      - generic [ref=e3012]:
        - generic [ref=e3013]:
          - button "É normal aparecerem bolhas logo após a instalação?" [expanded] [ref=e3014] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3015]: 
          - region "É normal aparecerem bolhas logo após a instalação?" [ref=e3017]: Sim. Pequenas bolhas são normais durante a secagem da cola e costumam desaparecer naturalmente entre 24 e 72 horas. Evite apertá-las ou tentar furá-las.
        - generic [ref=e3018]:
          - button "Vejo manchas ou acúmulo de cola. É normal?" [expanded] [ref=e3019] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3020]: 
          - region "Vejo manchas ou acúmulo de cola. É normal?" [ref=e3022]: Sim. Durante a instalação pode haver pequenos resíduos de cola, que secam e desaparecem em poucos dias. Não tente remover com panos úmidos ou produtos químicos sem orientação.
        - generic [ref=e3023]:
          - button "Qual a diferença entre papel de parede e adesivo de parede?" [expanded] [ref=e3024] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3025]: 
          - region "Qual a diferença entre papel de parede e adesivo de parede?" [ref=e3027]: Embora possam parecer semelhantes, são produtos bem diferentes. O papel de parede possui maior durabilidade, acabamento superior, melhor encaixe entre as emendas e aparência muito mais sofisticada. O adesivo de PVC tende a encolher, desbota com o tempo e tem vida útil inferior. Se o objetivo é um acabamento elegante e duradouro, o papel de parede é a melhor escolha.
        - generic [ref=e3028]:
          - button "Posso limpar o papel de parede?" [expanded] [ref=e3029] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3030]: 
          - region "Posso limpar o papel de parede?" [ref=e3032]: Depende do modelo. A maioria dos papéis vinílicos pode ser limpa com pano levemente úmido e detergente neutro.
        - generic [ref=e3033]:
          - button "Papel de parede pode ser aplicado em banheiro?" [expanded] [ref=e3034] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3035]: 
          - region "Papel de parede pode ser aplicado em banheiro?" [ref=e3037]: Sim, desde que seja na área seca, sem contato direto com água. Trabalhamos com papéis específicos que suportam melhor a umidade do ambiente.
        - generic [ref=e3038]:
          - button "Posso aplicar papel de parede sobre azulejo ou cerâmica?" [expanded] [ref=e3039] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3040]: 
          - region "Posso aplicar papel de parede sobre azulejo ou cerâmica?" [ref=e3042]: Sim, é possível. Porém, antes da instalação é necessário emassar toda a superfície para eliminar as juntas dos azulejos e aplicar uma seladora, garantindo uma base lisa e adequada. A preparação da parede deve ser realizada previamente por um profissional de pintura, nossa equipe realiza apenas a instalação do papel sobre a superfície já preparada.
        - generic [ref=e3043]:
          - button "Preciso pintar a parede antes?" [expanded] [ref=e3044] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3045]: 
          - region "Preciso pintar a parede antes?" [ref=e3047]: Nem sempre. É necessário apenas que a parede esteja lisa, seca, firme e sem infiltrações.
