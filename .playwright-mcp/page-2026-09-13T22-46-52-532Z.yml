                - generic [ref=f18e3042]:
                  - button "É normal aparecerem bolhas logo após a instalação?" [expanded] [ref=f18e3043] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f18e3044]:  +
                  - region "É normal aparecerem bolhas logo após a instalação?" [ref=f18e3046]: Sim. Pequenas bolhas são normais durante a secagem da cola e costumam desaparecer naturalmente entre 24 e 72 horas. Evite apertá-las ou tentar furá-las.
                - generic [ref=f18e3047]:
                  - button "Vejo manchas ou acúmulo de cola. É normal?" [expanded] [ref=f18e3048] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f18e3049]:  +
                  - region "Vejo manchas ou acúmulo de cola. É normal?" [ref=f18e3051]: Sim. Durante a instalação pode haver pequenos resíduos de cola, que secam e desaparecem em poucos dias. Não tente remover com panos úmidos ou produtos químicos sem orientação.
                - generic [ref=f18e3052]:
                  - button "Qual a diferença entre papel de parede e adesivo de parede?" [expanded] [ref=f18e3053] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f18e3054]:  +
                  - region "Qual a diferença entre papel de parede e adesivo de parede?" [ref=f18e3056]: Embora possam parecer semelhantes, são produtos bem diferentes. O papel de parede possui maior durabilidade, acabamento superior, melhor encaixe entre as emendas e aparência muito mais sofisticada. O adesivo de PVC tende a encolher, desbota com o tempo e tem vida útil inferior. Se o objetivo é um acabamento elegante e duradouro, o papel de parede é a melhor escolha.
                - generic [ref=f18e3057]:
                  - button "Posso limpar o papel de parede?" [expanded] [ref=f18e3058] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f18e3059]:  +
                  - region "Posso limpar o papel de parede?" [ref=f18e3061]: Depende do modelo. A maioria dos papéis vinílicos pode ser limpa com pano levemente úmido e detergente neutro.
                - generic [ref=f18e3062]:
                  - button "Papel de parede pode ser aplicado em banheiro?" [expanded] [ref=f18e3063] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f18e3064]:  +
                  - region "Papel de parede pode ser aplicado em banheiro?" [ref=f18e3066]: Sim, desde que seja na área seca, sem contato direto com água. Trabalhamos com papéis específicos que suportam melhor a umidade do ambiente.
                - generic [ref=f18e3067]:
                  - button "Posso aplicar papel de parede sobre azulejo ou cerâmica?" [expanded] [ref=f18e3068] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f18e3069]:  +
                  - region "Posso aplicar papel de parede sobre azulejo ou cerâmica?" [ref=f18e3071]: Sim, é possível. Porém, antes da instalação é necessário emassar toda a superfície para eliminar as juntas dos azulejos e aplicar uma seladora, garantindo uma base lisa e adequada. A preparação da parede deve ser realizada previamente por um profissional de pintura, nossa equipe realiza apenas a instalação do papel sobre a superfície já preparada.
                - generic [ref=f18e3072]:
                  - button "Preciso pintar a parede antes?" [expanded] [ref=f18e3073] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f18e3074]:  +
                  - region "Preciso pintar a parede antes?" [ref=f18e3076]: Nem sempre. É necessário apenas que a parede esteja lisa, seca, firme e sem infiltrações.
                - generic [ref=f18e3077]:
                  - button "Pode aplicar sobre outro papel de parede?" [expanded] [ref=f18e3078] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f18e3079]:  +
                  - region "Pode aplicar sobre outro papel de parede?" [ref=f18e3081]: O recomendado é remover o papel antigo para garantir uma instalação perfeita.
                - generic [ref=f18e3082]:
                  - button "Pode instalar na cozinha?" [expanded] [ref=f18e3083] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f18e3084]:  +
                  - region "Pode instalar na cozinha?" [ref=f18e3086]: Sim, desde que não fique atrás da pia, fogão ou locais com contato constante com gordura e água.
                - generic [ref=f18e3087]:
                  - button "O papel estraga a parede?" [expanded] [ref=f18e3088] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f18e3089]:  +
                  - region "O papel estraga a parede?" [ref=f18e3091]: Não. Quando instalado corretamente sobre uma parede preparada, ele protege a superfície. A remoção depende do tipo de papel e da condição da parede.
                - generic [ref=f18e3092]:
                  - button "Quanto tempo dura o papel de parede?" [expanded] [ref=f18e3093] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f18e3094]:  +
                  - region "Quanto tempo dura o papel de parede?" [ref=f18e3096]: Com instalação profissional e os cuidados corretos, é comum que dure entre 10 e 15 anos, podendo durar ainda mais em ambientes bem conservados.
                - generic [ref=f18e3097]:
                  - button "Em quanto tempo a instalação fica pronta?" [expanded] [ref=f18e3098] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f18e3099]:  +
                  - region "Em quanto tempo a instalação fica pronta?" [ref=f18e3101]: Na maioria dos ambientes residenciais, a instalação é concluída em apenas um dia.
                - generic [ref=f18e3102]:
                  - button "Qual a diferença entre papel vinílico e Non Woven (TNT)?" [expanded] [ref=f18e3103] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f18e3104]:  +
                  - region "Qual a diferença entre papel vinílico e Non Woven (TNT)?" [ref=f18e3106]: O papel vinílico recebe uma camada de PVC na superfície, é resistente à limpeza e ao desgaste do dia a dia, com excelente durabilidade. O Non Woven (TNT Premium) é produzido com fibras têxteis de alta qualidade, considerado linha premium pelos principais fabricantes europeus. É mais respirável, tem maior estabilidade dimensional, evita bolhas por umidade residual e tem fácil remoção na hora da troca. Nossa equipe ajuda você a escolher o mais indicado para cada ambiente.
                - generic [ref=f18e3107]:
                  - button "Vocês têm papéis importados à pronta entrega?" [expanded] [ref=f18e3108] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f18e3109]:  +
                  - region "Vocês têm papéis importados à pronta entrega?" [ref=f18e3111]: Sim. Mantemos estoque de diversos modelos importados para agilizar a entrega. Também trabalhamos com catálogos exclusivos e lançamentos de grandes fabricantes internacionais.
                - generic [ref=f18e3112]:
                  - button "Papel de parede com relevo acumula poeira?" [expanded] [ref=f18e3113] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f18e3114]:  +
                  - region "Papel de parede com relevo acumula poeira?" [ref=f18e3116]: Não de forma significativa. A poeira é semelhante à de uma parede pintada e pode ser removida com espanador, pano seco ou aspirador com bocal de escova. A textura não exige manutenção especial.
                - generic [ref=f18e3117]:
                  - button "Se eu enjoar, é fácil trocar?" [expanded] [ref=f18e3118] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f18e3119]:  +
                  - region "Se eu enjoar, é fácil trocar?" [ref=f18e3121]: Sim. O papel pode ser removido e substituído quando quiser renovar o ambiente. Nos papéis Non Woven, a remoção é bastante simples quando a parede foi preparada corretamente.
                - generic [ref=f18e3122]:
                  - button "A instalação tem cheiro?" [expanded] [ref=f18e3123] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f18e3124]:  +
                  - region "A instalação tem cheiro?" [ref=f18e3126]: Não. Utilizamos cola à base de água, própria para instalação de papéis de parede.
                - generic [ref=f18e3127]:
                  - button "Vale mais a pena pintar ou colocar papel de parede?" [expanded] [ref=f18e3128] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f18e3129]:  +
                  - region "Vale mais a pena pintar ou colocar papel de parede?" [ref=f18e3131]: Quando pensamos em custo-benefício a longo prazo, o papel de parede costuma ser a melhor escolha. Enquanto a pintura precisa de retoques a cada poucos anos, um papel de qualidade dura entre 10 e 15 anos mantendo beleza e acabamento. Além disso, agrega textura, estampas exclusivas e sofisticação, transformando o ambiente com rapidez e pouca sujeira.
