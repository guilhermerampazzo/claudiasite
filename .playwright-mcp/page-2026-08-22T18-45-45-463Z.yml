        - text: Perguntas
        - emphasis [ref=f4e3576]: mais comuns
      - generic [ref=f4e3582]:
        - generic [ref=f4e3583]:
          - button "É normal aparecerem bolhas logo após a instalação?" [expanded] [ref=f4e3584] [cursor=pointer]: 
          - region "É normal aparecerem bolhas logo após a instalação?" [ref=f4e3586]: Sim. Pequenas bolhas são normais durante a secagem da cola e costumam desaparecer naturalmente entre 24 e 72 horas. Evite apertá-las ou tentar furá-las.
        - generic [ref=f4e3587]:
          - button "Vejo manchas ou acúmulo de cola. É normal?" [expanded] [ref=f4e3588] [cursor=pointer]: 
          - region "Vejo manchas ou acúmulo de cola. É normal?" [ref=f4e3590]: Sim. Durante a instalação pode haver pequenos resíduos de cola, que secam e desaparecem em poucos dias. Não tente remover com panos úmidos ou produtos químicos sem orientação.
        - generic [ref=f4e3591]:
          - button "Qual a diferença entre papel de parede e adesivo de parede?" [expanded] [ref=f4e3592] [cursor=pointer]: 
          - region "Qual a diferença entre papel de parede e adesivo de parede?" [ref=f4e3594]: Embora possam parecer semelhantes, são produtos bem diferentes. O papel de parede possui maior durabilidade, acabamento superior, melhor encaixe entre as emendas e aparência muito mais sofisticada. O adesivo de PVC tende a encolher, desbota com o tempo e tem vida útil inferior. Se o objetivo é um acabamento elegante e duradouro, o papel de parede é a melhor escolha.
        - generic [ref=f4e3595]:
          - button "Posso limpar o papel de parede?" [expanded] [ref=f4e3596] [cursor=pointer]: 
          - region "Posso limpar o papel de parede?" [ref=f4e3598]: Depende do modelo. A maioria dos papéis vinílicos pode ser limpa com pano levemente úmido e detergente neutro.
        - generic [ref=f4e3599]:
          - button "Papel de parede pode ser aplicado em banheiro?" [expanded] [ref=f4e3600] [cursor=pointer]: 
          - region "Papel de parede pode ser aplicado em banheiro?" [ref=f4e3602]: Sim, desde que seja na área seca, sem contato direto com água. Trabalhamos com papéis específicos que suportam melhor a umidade do ambiente.
        - generic [ref=f4e3603]:
          - button "Posso aplicar papel de parede sobre azulejo ou cerâmica?" [expanded] [ref=f4e3604] [cursor=pointer]: 
          - region "Posso aplicar papel de parede sobre azulejo ou cerâmica?" [ref=f4e3606]: Sim, é possível. Porém, antes da instalação é necessário emassar toda a superfície para eliminar as juntas dos azulejos e aplicar uma seladora, garantindo uma base lisa e adequada. A preparação da parede deve ser realizada previamente por um profissional de pintura, nossa equipe realiza apenas a instalação do papel sobre a superfície já preparada.
        - generic [ref=f4e3607]:
          - button "Preciso pintar a parede antes?" [expanded] [ref=f4e3608] [cursor=pointer]: 
          - region "Preciso pintar a parede antes?" [ref=f4e3610]: Nem sempre. É necessário apenas que a parede esteja lisa, seca, firme e sem infiltrações.
        - generic [ref=f4e3611]:
          - button "Pode aplicar sobre outro papel de parede?" [expanded] [ref=f4e3612] [cursor=pointer]: 
          - region "Pode aplicar sobre outro papel de parede?" [ref=f4e3614]: O recomendado é remover o papel antigo para garantir uma instalação perfeita.
        - generic [ref=f4e3615]:
          - button "Pode instalar na cozinha?" [expanded] [ref=f4e3616] [cursor=pointer]: 
          - region "Pode instalar na cozinha?" [ref=f4e3618]: Sim, desde que não fique atrás da pia, fogão ou locais com contato constante com gordura e água.
        - generic [ref=f4e3619]:
          - button "O papel estraga a parede?" [expanded] [ref=f4e3620] [cursor=pointer]: 
          - region "O papel estraga a parede?" [ref=f4e3622]: Não. Quando instalado corretamente sobre uma parede preparada, ele protege a superfície. A remoção depende do tipo de papel e da condição da parede.
        - generic [ref=f4e3623]:
          - button "Quanto tempo dura o papel de parede?" [expanded] [ref=f4e3624] [cursor=pointer]: 
          - region "Quanto tempo dura o papel de parede?" [ref=f4e3626]: Com instalação profissional e os cuidados corretos, é comum que dure entre 10 e 15 anos, podendo durar ainda mais em ambientes bem conservados.
        - generic [ref=f4e3627]:
          - button "Em quanto tempo a instalação fica pronta?" [expanded] [ref=f4e3628] [cursor=pointer]: 
          - region "Em quanto tempo a instalação fica pronta?" [ref=f4e3630]: Na maioria dos ambientes residenciais, a instalação é concluída em apenas um dia.
        - generic [ref=f4e3631]:
          - button "Qual a diferença entre papel vinílico e Non Woven (TNT)?" [expanded] [ref=f4e3632] [cursor=pointer]: 
          - region "Qual a diferença entre papel vinílico e Non Woven (TNT)?" [ref=f4e3634]: O papel vinílico recebe uma camada de PVC na superfície, é resistente à limpeza e ao desgaste do dia a dia, com excelente durabilidade. O Non Woven (TNT Premium) é produzido com fibras têxteis de alta qualidade, considerado linha premium pelos principais fabricantes europeus. É mais respirável, tem maior estabilidade dimensional, evita bolhas por umidade residual e tem fácil remoção na hora da troca. Nossa equipe ajuda você a escolher o mais indicado para cada ambiente.
        - generic [ref=f4e3635]:
          - button "Vocês têm papéis importados à pronta entrega?" [expanded] [ref=f4e3636] [cursor=pointer]: 
          - region "Vocês têm papéis importados à pronta entrega?" [ref=f4e3638]: Sim. Mantemos estoque de diversos modelos importados para agilizar a entrega. Também trabalhamos com catálogos exclusivos e lançamentos de grandes fabricantes internacionais.
        - generic [ref=f4e3639]:
          - button "Papel de parede com relevo acumula poeira?" [expanded] [ref=f4e3640] [cursor=pointer]: 
          - region "Papel de parede com relevo acumula poeira?" [ref=f4e3642]: Não de forma significativa. A poeira é semelhante à de uma parede pintada e pode ser removida com espanador, pano seco ou aspirador com bocal de escova. A textura não exige manutenção especial.
        - generic [ref=f4e3643]:
          - button "Se eu enjoar, é fácil trocar?" [expanded] [ref=f4e3644] [cursor=pointer]: 
          - region "Se eu enjoar, é fácil trocar?" [ref=f4e3646]: Sim. O papel pode ser removido e substituído quando quiser renovar o ambiente. Nos papéis Non Woven, a remoção é bastante simples quando a parede foi preparada corretamente.
        - generic [ref=f4e3647]:
          - button "A instalação tem cheiro?" [expanded] [ref=f4e3648] [cursor=pointer]: 
          - region "A instalação tem cheiro?" [ref=f4e3650]: Não. Utilizamos cola à base de água, própria para instalação de papéis de parede.
        - generic [ref=f4e3651]:
          - button "Vale mais a pena pintar ou colocar papel de parede?" [expanded] [ref=f4e3652] [cursor=pointer]: 
          - region "Vale mais a pena pintar ou colocar papel de parede?" [ref=f4e3654]: Quando pensamos em custo-benefício a longo prazo, o papel de parede costuma ser a melhor escolha. Enquanto a pintura precisa de retoques a cada poucos anos, um papel de qualidade dura entre 10 e 15 anos mantendo beleza e acabamento. Além disso, agrega textura, estampas exclusivas e sofisticação, transformando o ambiente com rapidez e pouca sujeira.
        - generic [ref=f4e3655]:
          - button "Posso instalar atrás da cabeceira da cama?" [expanded] [ref=f4e3656] [cursor=pointer]: 
          - region "Posso instalar atrás da cabeceira da cama?" [ref=f4e3658]: Sim. Essa é uma das aplicações mais procuradas e cria um grande impacto visual sem necessidade de reformas.
        - generic [ref=f4e3659]:
          - button "Papel de parede pode mofar?" [expanded] [ref=f4e3660] [cursor=pointer]: 
          - region "Papel de parede pode mofar?" [ref=f4e3662]: O papel de parede não é a causa do mofo. Se houver infiltração ou umidade na parede, o problema precisa ser resolvido antes da instalação... caso contrário, qualquer revestimento pode ser comprometido.
