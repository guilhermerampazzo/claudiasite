    - generic [ref=f4e3021]:
      - generic [ref=f4e3022]: Dúvidas frequentes
      - heading [level=2] [ref=f4e3029]:
        - text: Perguntas
        - emphasis [ref=f4e3030]: mais comuns
      - generic [ref=f4e3036]:
        - generic [ref=f4e3037]:
          - button "É normal aparecerem bolhas logo após a instalação?" [expanded] [ref=f4e3038] [cursor=pointer]:
            - generic [aria-hidden] [ref=f4e3039]: 
          - region "É normal aparecerem bolhas logo após a instalação?" [ref=f4e3041]: Sim. Pequenas bolhas são normais durante a secagem da cola e costumam desaparecer naturalmente entre 24 e 72 horas. Evite apertá-las ou tentar furá-las.
        - generic [ref=f4e3042]:
          - button "Vejo manchas ou acúmulo de cola. É normal?" [expanded] [ref=f4e3043] [cursor=pointer]:
            - generic [aria-hidden] [ref=f4e3044]: 
          - region "Vejo manchas ou acúmulo de cola. É normal?" [ref=f4e3046]: Sim. Durante a instalação pode haver pequenos resíduos de cola, que secam e desaparecem em poucos dias. Não tente remover com panos úmidos ou produtos químicos sem orientação.
        - generic [ref=f4e3047]:
          - button "Qual a diferença entre papel de parede e adesivo de parede?" [expanded] [ref=f4e3048] [cursor=pointer]:
            - generic [aria-hidden] [ref=f4e3049]: 
          - region "Qual a diferença entre papel de parede e adesivo de parede?" [ref=f4e3051]: Embora possam parecer semelhantes, são produtos bem diferentes. O papel de parede possui maior durabilidade, acabamento superior, melhor encaixe entre as emendas e aparência muito mais sofisticada. O adesivo de PVC tende a encolher, desbota com o tempo e tem vida útil inferior. Se o objetivo é um acabamento elegante e duradouro, o papel de parede é a melhor escolha.
        - generic [ref=f4e3052]:
          - button "Posso limpar o papel de parede?" [expanded] [ref=f4e3053] [cursor=pointer]:
            - generic [aria-hidden] [ref=f4e3054]: 
          - region "Posso limpar o papel de parede?" [ref=f4e3056]: Depende do modelo. A maioria dos papéis vinílicos pode ser limpa com pano levemente úmido e detergente neutro.
        - generic [ref=f4e3057]:
          - button "Papel de parede pode ser aplicado em banheiro?" [expanded] [ref=f4e3058] [cursor=pointer]:
            - generic [aria-hidden] [ref=f4e3059]: 
          - region "Papel de parede pode ser aplicado em banheiro?" [ref=f4e3061]: Sim, desde que seja na área seca, sem contato direto com água. Trabalhamos com papéis específicos que suportam melhor a umidade do ambiente.
        - generic [ref=f4e3062]:
          - button "Posso aplicar papel de parede sobre azulejo ou cerâmica?" [expanded] [ref=f4e3063] [cursor=pointer]:
            - generic [aria-hidden] [ref=f4e3064]: 
          - region "Posso aplicar papel de parede sobre azulejo ou cerâmica?" [ref=f4e3066]: Sim, é possível. Porém, antes da instalação é necessário emassar toda a superfície para eliminar as juntas dos azulejos e aplicar uma seladora, garantindo uma base lisa e adequada. A preparação da parede deve ser realizada previamente por um profissional de pintura, nossa equipe realiza apenas a instalação do papel sobre a superfície já preparada.
        - generic [ref=f4e3067]:
          - button "Preciso pintar a parede antes?" [expanded] [ref=f4e3068] [cursor=pointer]:
            - generic [aria-hidden] [ref=f4e3069]: 
          - region "Preciso pintar a parede antes?" [ref=f4e3071]: Nem sempre. É necessário apenas que a parede esteja lisa, seca, firme e sem infiltrações.
        - generic [ref=f4e3072]:
          - button "Pode aplicar sobre outro papel de parede?" [expanded] [ref=f4e3073] [cursor=pointer]:
            - generic [aria-hidden] [ref=f4e3074]: 
          - region "Pode aplicar sobre outro papel de parede?" [ref=f4e3076]: O recomendado é remover o papel antigo para garantir uma instalação perfeita.
        - generic [ref=f4e3077]:
          - button "Pode instalar na cozinha?" [expanded] [ref=f4e3078] [cursor=pointer]:
            - generic [aria-hidden] [ref=f4e3079]: 
          - region "Pode instalar na cozinha?" [ref=f4e3081]: Sim, desde que não fique atrás da pia, fogão ou locais com contato constante com gordura e água.
        - generic [ref=f4e3082]:
          - button "O papel estraga a parede?" [expanded] [ref=f4e3083] [cursor=pointer]:
            - generic [aria-hidden] [ref=f4e3084]: 
          - region "O papel estraga a parede?" [ref=f4e3086]: Não. Quando instalado corretamente sobre uma parede preparada, ele protege a superfície. A remoção depende do tipo de papel e da condição da parede.
        - generic [ref=f4e3087]:
          - button "Quanto tempo dura o papel de parede?" [expanded] [ref=f4e3088] [cursor=pointer]:
            - generic [aria-hidden] [ref=f4e3089]: 
          - region "Quanto tempo dura o papel de parede?" [ref=f4e3091]: Com instalação profissional e os cuidados corretos, é comum que dure entre 10 e 15 anos, podendo durar ainda mais em ambientes bem conservados.
        - generic [ref=f4e3092]:
          - button "Em quanto tempo a instalação fica pronta?" [expanded] [ref=f4e3093] [cursor=pointer]:
            - generic [aria-hidden] [ref=f4e3094]: 
          - region "Em quanto tempo a instalação fica pronta?" [ref=f4e3096]: Na maioria dos ambientes residenciais, a instalação é concluída em apenas um dia.
        - generic [ref=f4e3097]:
          - button "Qual a diferença entre papel vinílico e Non Woven (TNT)?" [expanded] [ref=f4e3098] [cursor=pointer]:
            - generic [aria-hidden] [ref=f4e3099]: 
          - region "Qual a diferença entre papel vinílico e Non Woven (TNT)?" [ref=f4e3101]: O papel vinílico recebe uma camada de PVC na superfície, é resistente à limpeza e ao desgaste do dia a dia, com excelente durabilidade. O Non Woven (TNT Premium) é produzido com fibras têxteis de alta qualidade, considerado linha premium pelos principais fabricantes europeus. É mais respirável, tem maior estabilidade dimensional, evita bolhas por umidade residual e tem fácil remoção na hora da troca. Nossa equipe ajuda você a escolher o mais indicado para cada ambiente.
        - generic [ref=f4e3102]:
          - button "Vocês têm papéis importados à pronta entrega?" [expanded] [ref=f4e3103] [cursor=pointer]:
            - generic [aria-hidden] [ref=f4e3104]: 
          - region "Vocês têm papéis importados à pronta entrega?" [ref=f4e3106]: Sim. Mantemos estoque de diversos modelos importados para agilizar a entrega. Também trabalhamos com catálogos exclusivos e lançamentos de grandes fabricantes internacionais.
        - generic [ref=f4e3107]:
          - button "Papel de parede com relevo acumula poeira?" [expanded] [ref=f4e3108] [cursor=pointer]:
            - generic [aria-hidden] [ref=f4e3109]: 
          - region "Papel de parede com relevo acumula poeira?" [ref=f4e3111]: Não de forma significativa. A poeira é semelhante à de uma parede pintada e pode ser removida com espanador, pano seco ou aspirador com bocal de escova. A textura não exige manutenção especial.
        - generic [ref=f4e3112]:
          - button "Se eu enjoar, é fácil trocar?" [expanded] [ref=f4e3113] [cursor=pointer]:
            - generic [aria-hidden] [ref=f4e3114]: 
          - region "Se eu enjoar, é fácil trocar?" [ref=f4e3116]: Sim. O papel pode ser removido e substituído quando quiser renovar o ambiente. Nos papéis Non Woven, a remoção é bastante simples quando a parede foi preparada corretamente.
        - generic [ref=f4e3117]:
          - button "A instalação tem cheiro?" [expanded] [ref=f4e3118] [cursor=pointer]:
            - generic [aria-hidden] [ref=f4e3119]: 
          - region "A instalação tem cheiro?" [ref=f4e3121]: Não. Utilizamos cola à base de água, própria para instalação de papéis de parede.
        - generic [ref=f4e3122]:
          - button "Vale mais a pena pintar ou colocar papel de parede?" [expanded] [ref=f4e3123] [cursor=pointer]:
            - generic [aria-hidden] [ref=f4e3124]: 
          - region "Vale mais a pena pintar ou colocar papel de parede?" [ref=f4e3126]: Quando pensamos em custo-benefício a longo prazo, o papel de parede costuma ser a melhor escolha. Enquanto a pintura precisa de retoques a cada poucos anos, um papel de qualidade dura entre 10 e 15 anos mantendo beleza e acabamento. Além disso, agrega textura, estampas exclusivas e sofisticação, transformando o ambiente com rapidez e pouca sujeira.
        - generic [ref=f4e3127]:
          - button "Posso instalar atrás da cabeceira da cama?" [expanded] [ref=f4e3128] [cursor=pointer]:
            - generic [aria-hidden] [ref=f4e3129]: 
          - region "Posso instalar atrás da cabeceira da cama?" [ref=f4e3131]: Sim. Essa é uma das aplicações mais procuradas e cria um grande impacto visual sem necessidade de reformas.
        - generic [ref=f4e3132]:
          - button "Papel de parede pode mofar?" [expanded] [ref=f4e3133] [cursor=pointer]:
            - generic [aria-hidden] [ref=f4e3134]: 
          - region "Papel de parede pode mofar?" [ref=f4e3136]: O papel de parede não é a causa do mofo. Se houver infiltração ou umidade na parede, o problema precisa ser resolvido antes da instalação... caso contrário, qualquer revestimento pode ser comprometido.
