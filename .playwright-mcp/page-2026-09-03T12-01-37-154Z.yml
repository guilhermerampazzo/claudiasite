          - button "Vejo manchas ou acúmulo de cola. É normal?" [expanded] [ref=e3076] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3077]: 
          - region "Vejo manchas ou acúmulo de cola. É normal?" [ref=e3079]: Sim. Durante a instalação pode haver pequenos resíduos de cola, que secam e desaparecem em poucos dias. Não tente remover com panos úmidos ou produtos químicos sem orientação.
        - generic [ref=e3080]:
          - button "Qual a diferença entre papel de parede e adesivo de parede?" [expanded] [ref=e3081] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3082]: 
          - region "Qual a diferença entre papel de parede e adesivo de parede?" [ref=e3084]: Embora possam parecer semelhantes, são produtos bem diferentes. O papel de parede possui maior durabilidade, acabamento superior, melhor encaixe entre as emendas e aparência muito mais sofisticada. O adesivo de PVC tende a encolher, desbota com o tempo e tem vida útil inferior. Se o objetivo é um acabamento elegante e duradouro, o papel de parede é a melhor escolha.
        - generic [ref=e3085]:
          - button "Posso limpar o papel de parede?" [expanded] [ref=e3086] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3087]: 
          - region "Posso limpar o papel de parede?" [ref=e3089]: Depende do modelo. A maioria dos papéis vinílicos pode ser limpa com pano levemente úmido e detergente neutro.
        - generic [ref=e3090]:
          - button "Papel de parede pode ser aplicado em banheiro?" [expanded] [ref=e3091] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3092]: 
          - region "Papel de parede pode ser aplicado em banheiro?" [ref=e3094]: Sim, desde que seja na área seca, sem contato direto com água. Trabalhamos com papéis específicos que suportam melhor a umidade do ambiente.
        - generic [ref=e3095]:
          - button "Posso aplicar papel de parede sobre azulejo ou cerâmica?" [expanded] [ref=e3096] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3097]: 
          - region "Posso aplicar papel de parede sobre azulejo ou cerâmica?" [ref=e3099]: Sim, é possível. Porém, antes da instalação é necessário emassar toda a superfície para eliminar as juntas dos azulejos e aplicar uma seladora, garantindo uma base lisa e adequada. A preparação da parede deve ser realizada previamente por um profissional de pintura, nossa equipe realiza apenas a instalação do papel sobre a superfície já preparada.
        - generic [ref=e3100]:
          - button "Preciso pintar a parede antes?" [expanded] [ref=e3101] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3102]: 
          - region "Preciso pintar a parede antes?" [ref=e3104]: Nem sempre. É necessário apenas que a parede esteja lisa, seca, firme e sem infiltrações.
        - generic [ref=e3105]:
          - button "Pode aplicar sobre outro papel de parede?" [expanded] [ref=e3106] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3107]: 
          - region "Pode aplicar sobre outro papel de parede?" [ref=e3109]: O recomendado é remover o papel antigo para garantir uma instalação perfeita.
        - generic [ref=e3110]:
          - button "Pode instalar na cozinha?" [expanded] [ref=e3111] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3112]: 
          - region "Pode instalar na cozinha?" [ref=e3114]: Sim, desde que não fique atrás da pia, fogão ou locais com contato constante com gordura e água.
        - generic [ref=e3115]:
          - button "O papel estraga a parede?" [expanded] [ref=e3116] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3117]: 
          - region "O papel estraga a parede?" [ref=e3119]: Não. Quando instalado corretamente sobre uma parede preparada, ele protege a superfície. A remoção depende do tipo de papel e da condição da parede.
        - generic [ref=e3120]:
          - button "Quanto tempo dura o papel de parede?" [expanded] [ref=e3121] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3122]: 
          - region "Quanto tempo dura o papel de parede?" [ref=e3124]: Com instalação profissional e os cuidados corretos, é comum que dure entre 10 e 15 anos, podendo durar ainda mais em ambientes bem conservados.
        - generic [ref=e3125]:
          - button "Em quanto tempo a instalação fica pronta?" [expanded] [ref=e3126] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3127]: 
          - region "Em quanto tempo a instalação fica pronta?" [ref=e3129]: Na maioria dos ambientes residenciais, a instalação é concluída em apenas um dia.
        - generic [ref=e3130]:
          - button "Qual a diferença entre papel vinílico e Non Woven (TNT)?" [expanded] [ref=e3131] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3132]: 
          - region "Qual a diferença entre papel vinílico e Non Woven (TNT)?" [ref=e3134]: O papel vinílico recebe uma camada de PVC na superfície, é resistente à limpeza e ao desgaste do dia a dia, com excelente durabilidade. O Non Woven (TNT Premium) é produzido com fibras têxteis de alta qualidade, considerado linha premium pelos principais fabricantes europeus. É mais respirável, tem maior estabilidade dimensional, evita bolhas por umidade residual e tem fácil remoção na hora da troca. Nossa equipe ajuda você a escolher o mais indicado para cada ambiente.
        - generic [ref=e3135]:
          - button "Vocês têm papéis importados à pronta entrega?" [expanded] [ref=e3136] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3137]: 
          - region "Vocês têm papéis importados à pronta entrega?" [ref=e3139]: Sim. Mantemos estoque de diversos modelos importados para agilizar a entrega. Também trabalhamos com catálogos exclusivos e lançamentos de grandes fabricantes internacionais.
        - generic [ref=e3140]:
          - button "Papel de parede com relevo acumula poeira?" [expanded] [ref=e3141] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3142]: 
          - region "Papel de parede com relevo acumula poeira?" [ref=e3144]: Não de forma significativa. A poeira é semelhante à de uma parede pintada e pode ser removida com espanador, pano seco ou aspirador com bocal de escova. A textura não exige manutenção especial.
        - generic [ref=e3145]:
          - button "Se eu enjoar, é fácil trocar?" [expanded] [ref=e3146] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3147]: 
          - region "Se eu enjoar, é fácil trocar?" [ref=e3149]: Sim. O papel pode ser removido e substituído quando quiser renovar o ambiente. Nos papéis Non Woven, a remoção é bastante simples quando a parede foi preparada corretamente.
        - generic [ref=e3150]:
          - button "A instalação tem cheiro?" [expanded] [ref=e3151] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3152]: 
          - region "A instalação tem cheiro?" [ref=e3154]: Não. Utilizamos cola à base de água, própria para instalação de papéis de parede.
        - generic [ref=e3155]:
          - button "Vale mais a pena pintar ou colocar papel de parede?" [expanded] [ref=e3156] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3157]: 
          - region "Vale mais a pena pintar ou colocar papel de parede?" [ref=e3159]: Quando pensamos em custo-benefício a longo prazo, o papel de parede costuma ser a melhor escolha. Enquanto a pintura precisa de retoques a cada poucos anos, um papel de qualidade dura entre 10 e 15 anos mantendo beleza e acabamento. Além disso, agrega textura, estampas exclusivas e sofisticação, transformando o ambiente com rapidez e pouca sujeira.
        - generic [ref=e3160]:
          - button "Posso instalar atrás da cabeceira da cama?" [expanded] [ref=e3161] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3162]: 
          - region "Posso instalar atrás da cabeceira da cama?" [ref=e3164]: Sim. Essa é uma das aplicações mais procuradas e cria um grande impacto visual sem necessidade de reformas.
        - generic [ref=e3165]:
          - button "Papel de parede pode mofar?" [expanded] [ref=e3166] [cursor=pointer]:
            - generic [aria-hidden] [ref=e3167]: 
          - region "Papel de parede pode mofar?" [ref=e3169]: O papel de parede não é a causa do mofo. Se houver infiltração ou umidade na parede, o problema precisa ser resolvido antes da instalação... caso contrário, qualquer revestimento pode ser comprometido.
